<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTRL SHIFT Vol. 9 — Your Matches</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface-2: #1a1a24;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --accent: #c8ff00;
  --accent-dim: #c8ff0022;
  --pink: #ff3d8e;
  --blue: #3d8eff;
  --purple: #8e3dff;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

.noise {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.glow-orb {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}

.glow-orb.one { background: var(--accent); top: -200px; right: -100px; }
.glow-orb.two { background: var(--pink); bottom: -200px; left: -150px; }

.container {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* Header */
.header {
  text-align: center;
  padding: 48px 0 40px;
}

.header-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.header-label::before, .header-label::after {
  content: '';
  width: 40px;
  height: 1px;
  background: var(--accent);
  opacity: 0.4;
}

.header h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 8vw, 3.2rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}

.header h1 .highlight {
  background: linear-gradient(135deg, var(--accent), #a0ff00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header .subtitle {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

/* Search / Landing */
.search-section {
  margin-top: 20px;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.search-box input::placeholder { color: var(--text-dim); }

.search-results {
  margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  max-height: 280px;
  overflow-y: auto;
}

.search-results::-webkit-scrollbar { width: 4px; }
.search-results::-webkit-scrollbar-track { background: transparent; }
.search-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.search-result-item {
  padding: 14px 20px;
  cursor: pointer;
  transition: background 0.2s;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--surface-2); }

.search-result-item .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  flex-shrink: 0;
}

.search-result-item .info { flex: 1; }
.search-result-item .info .name { font-size: 0.85rem; font-weight: 700; }
.search-result-item .info .role { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

/* Profile View */
.profile-section {
  animation: fadeUp 0.5s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 24px;
  transition: color 0.2s;
  letter-spacing: 0.05em;
}

.back-btn:hover { color: var(--accent); }

.profile-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}

.profile-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--pink), var(--blue));
}

.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--blue));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.5rem;
  margin: 0 auto 16px;
  color: var(--bg);
}

.profile-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
  margin-bottom: 4px;
}

.profile-role {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.profile-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}

.social-links {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
}

.social-link {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  transition: border-color 0.2s, transform 0.2s, color 0.2s;
}

.social-link:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.match-social-links {
  margin-top: 10px;
}

.match-social-links .social-link {
  width: 26px;
  height: 26px;
  font-size: 0.52rem;
}

.tag {
  font-size: 0.65rem;
  padding: 5px 10px;
  border-radius: 100px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  white-space: nowrap;
}

.tag.accent {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

/* Matches */
.matches-header {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.matches-header .count {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  background: var(--accent);
  color: var(--bg);
  padding: 2px 10px;
  border-radius: 100px;
  font-weight: 700;
}

.match-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  transition: border-color 0.3s, transform 0.2s;
  animation: fadeUp 0.4s ease both;
}

.match-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.match-card.top-strong {
  border-color: #c8ff0066;
  background:
    linear-gradient(180deg, rgba(200, 255, 0, 0.08) 0%, rgba(200, 255, 0, 0.02) 100%),
    var(--surface);
}

.match-card-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.match-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  flex-shrink: 0;
  color: var(--bg);
}

.match-info { flex: 1; }
.match-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; }
.match-role { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

.match-score {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  padding: 4px 10px;
  border-radius: 100px;
  font-weight: 700;
  white-space: nowrap;
}

.match-score.high { background: #c8ff0022; color: var(--accent); border: 1px solid #c8ff0044; }
.match-score.med { background: #3d8eff22; color: var(--blue); border: 1px solid #3d8eff44; }

.match-reason {
  font-size: 0.78rem;
  color: var(--text-dim);
  line-height: 1.55;
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 10px;
  border-left: 2px solid var(--accent);
}

.match-shared {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.shared-tag {
  font-size: 0.6rem;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
}

/* No matches */
.no-matches {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-dim);
}

.no-matches .emoji { font-size: 2.5rem; margin-bottom: 16px; }
.no-matches p { font-size: 0.85rem; line-height: 1.6; }

/* Group label */
.group-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 28px 0 12px;
  padding-left: 4px;
}

/* Archive / coming soon */
.archive-shell {
  animation: fadeUp 0.4s ease both;
}

.archive-grid {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

.status-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}

.status-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.status-card h3 {
  font-family: 'Syne', sans-serif;
  font-size: 1.2rem;
  margin-bottom: 8px;
}

.status-card p {
  font-size: 0.8rem;
  line-height: 1.6;
  color: var(--text-dim);
}

.status-card.vol10 {
  border-color: #3d8eff66;
  background:
    linear-gradient(180deg, rgba(61, 142, 255, 0.09) 0%, rgba(61, 142, 255, 0.02) 100%),
    var(--surface);
}

.status-link {
  display: block;
  text-decoration: none;
  color: inherit;
  transition: transform 0.2s, border-color 0.25s;
}

.status-link:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}

.raffle-shell {
  animation: fadeUp 0.35s ease both;
}

.raffle-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  position: relative;
  overflow: hidden;
}

.raffle-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--pink), var(--blue));
}

.raffle-metadata {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.raffle-meta-pill {
  font-size: 0.62rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-dim);
  padding: 4px 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.raffle-meta-pill.live {
  border-color: #3dff8e55;
  color: #3dff8e;
}

.raffle-meta-pill.fallback {
  border-color: #ff8e3d55;
  color: #ffbf8e;
}

.raffle-display {
  min-height: 130px;
  border: 1px solid #c8ff0033;
  border-radius: 14px;
  background:
    radial-gradient(circle at 12% 10%, rgba(200, 255, 0, 0.12), rgba(0, 0, 0, 0) 45%),
    radial-gradient(circle at 88% 90%, rgba(255, 61, 142, 0.09), rgba(0, 0, 0, 0) 40%),
    var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
}

.raffle-display-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.raffle-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.5rem, 5vw, 2.2rem);
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.raffle-winner-badge {
  margin-top: 8px;
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.raffle-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.raffle-btn {
  flex: 1;
  min-width: 170px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  padding: 13px 16px;
  font-family: 'Space Mono', monospace;
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s, background 0.2s;
}

.raffle-btn.primary {
  background: var(--accent);
  color: var(--bg);
}

.raffle-btn.secondary {
  background: transparent;
  color: var(--text-dim);
  border-color: var(--border);
}

.raffle-btn:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.raffle-btn:not(:disabled):hover {
  transform: translateY(-1px);
}

.raffle-status {
  margin-top: 12px;
  font-size: 0.74rem;
  line-height: 1.55;
  color: var(--text-dim);
}

.raffle-history {
  margin-top: 16px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.raffle-history h4 {
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.raffle-history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.raffle-history-item {
  font-size: 0.68rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  color: var(--text);
  background: var(--surface-2);
}

.raffle-confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.raffle-confetti-piece {
  position: absolute;
  top: -20px;
  left: var(--x);
  width: 8px;
  height: 12px;
  border-radius: 2px;
  background: var(--color);
  opacity: 0.88;
  transform: rotate(var(--r));
  animation: confettiDrop 1.4s ease forwards;
  animation-delay: var(--d);
}

@keyframes confettiDrop {
  0% {
    transform: translate3d(0, -24px, 0) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  100% {
    transform: translate3d(calc((var(--x) - 50vw) * 0.1), 300px, 0) rotate(540deg);
    opacity: 0;
  }
}

.unlock-form {
  margin-top: 14px;
  display: grid;
  gap: 10px;
}

.unlock-form input {
  width: 100%;
  padding: 13px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  outline: none;
}

.unlock-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.unlock-btn {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--bg);
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  font-weight: 700;
}

.unlock-error {
  font-size: 0.72rem;
  color: #ff6f91;
  min-height: 1.1em;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 0 20px;
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

/* Mobile polish */
@media (max-width: 480px) {
  .container { padding: 16px 16px 60px; }
  .header { padding: 32px 0 28px; }
  .profile-card { padding: 24px 16px; }
  .match-card { padding: 16px; }
  .search-box input,
  .unlock-form input {
    font-size: 16px;
  }
  .raffle-card {
    padding: 18px 16px;
  }
  .raffle-btn {
    min-width: 100%;
  }
}
</style>
</head>

// Also add some aliases for flexible lookup
function normalizeKey(name) {
  return String(name || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[’‘`´]/g, "'")
    .replace(/['"]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function formatEventLabel(raw) {
  const text = String(raw || '').trim();
  if (!text) return 'Vol. 9';

  const volumeMatch = text.match(/^vol(?:ume)?[-_ ]?(\d+)$/i);
  if (volumeMatch) return `Vol. ${volumeMatch[1]}`;

  if (/^evt-/i.test(text)) return 'Current Event';

  return text
    .split(/[_-]+/g)
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/\b\w/g, (char) => char.toUpperCase());
}

function setActiveGuests(sourceGuests) {
  Object.keys(guestLookup).forEach((key) => delete guestLookup[key]);
  guestNames = [];
  const uniqueGuests = [];

  Object.keys(sourceGuests || {}).forEach((key) => {
    const guest = sourceGuests[key] || {};
    const normalizedGuest = {
      name: guest.name || key,
      role: guest.role || 'Guest',
      interests: Array.isArray(guest.interests) ? guest.interests : [],
      tools: guest.tools || '',
      socials: guest.socials && typeof guest.socials === 'object' ? guest.socials : {},
      matches: Array.isArray(guest.matches)
        ? guest.matches.map((match) => ({
            ...match,
            socials: match && match.socials && typeof match.socials === 'object' ? match.socials : {},
          }))
        : [],
    };

    uniqueGuests.push(normalizedGuest);
    guestLookup[normalizeKey(normalizedGuest.name)] = normalizedGuest;
    guestLookup[normalizeKey(key)] = normalizedGuest;
    guestNames.push(normalizedGuest.name);
  });

  uniqueGuests.forEach((guest) => {
    guest.matches = (guest.matches || []).map((match) => {
      if (match.socials && Object.keys(match.socials).length) return match;
      const targetGuest = guestLookup[normalizeKey(match.name)];
      return {
        ...match,
        socials: (targetGuest && targetGuest.socials) || {},
      };
    });
  });
}

function getSafeExternalUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const prefixed = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
  try {
    const parsed = new URL(prefixed);
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
    return parsed.toString();
  } catch (_error) {
    return '';
  }
}

function getSocialEntries(socials) {
  if (!socials || typeof socials !== 'object') return [];
  return Object.keys(SOCIAL_META)
    .map((platform) => {
      const url = getSafeExternalUrl(socials[platform]);
      if (!url) return null;
      return { ...SOCIAL_META[platform], platform, url };
    })
    .filter(Boolean);
}

function getRaffleEligibleGuests() {
  const seen = new Set();

  guestNames.forEach((name) => {
    const normalized = normalizeKey(name);
    if (!normalized || seen.has(normalized)) return;
    seen.add(normalized);
    uniqueNames.push(name);

  return uniqueNames;
}

function getRafflePool() {
  const eligible = getRaffleEligibleGuests();
  return eligible.filter((name) => !raffleState.excludedWinners.has(normalizeKey(name)));

function secureRandomInt(max) {
  if (!Number.isInteger(max) || max <= 0) return 0;

  if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
    const limit = Math.floor(0x100000000 / max) * max;
    const buffer = new Uint32Array(1);
    let value = 0;
    do {
      window.crypto.getRandomValues(buffer);
      value = buffer[0];
    } while (value >= limit);
    return value % max;
  }

  return Math.floor(Math.random() * max);
}

function ensureRaffleAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;

  if (!raffleAudioState.context) {
    raffleAudioState.context = new AudioContextClass();
  }

  if (raffleAudioState.context.state === 'suspended') {
    raffleAudioState.context.resume().catch(() => {});
  }

  return raffleAudioState.context;
}

function getRaffleNoiseBuffer(context) {
  if (!context) return null;

  if (raffleAudioState.noiseBuffer) return raffleAudioState.noiseBuffer;

  const duration = 0.2;
  const buffer = context.createBuffer(1, Math.floor(context.sampleRate * duration), context.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i += 1) {
    data[i] = Math.random() * 2 - 1;
  }

  raffleAudioState.noiseBuffer = buffer;
  return buffer;
}

function playRaffleSnareTick(level = 0.18, duration = 0.08, cutoff = 900) {
  const context = ensureRaffleAudioContext();
  if (!context) return;

  const noiseBuffer = getRaffleNoiseBuffer(context);
  if (!noiseBuffer) return;

  const source = context.createBufferSource();
  source.buffer = noiseBuffer;

  const filter = context.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.setValueAtTime(cutoff, context.currentTime);

  const gain = context.createGain();
  const now = context.currentTime;
  gain.gain.setValueAtTime(Math.max(level, 0.001), now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(context.destination);

  source.start(now);
  source.stop(now + duration);
}

function playRaffleWinnerHit() {
  const context = ensureRaffleAudioContext();
  if (!context) return;

  playRaffleSnareTick(0.34, 0.12, 600);

  const osc = context.createOscillator();
  const gain = context.createGain();
  const now = context.currentTime;
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(60, now + 0.16);
  gain.gain.setValueAtTime(0.28, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc.connect(gain);
  gain.connect(context.destination);
  osc.start(now);
  osc.stop(now + 0.22);
}

function stopRaffleDrumRoll(playFinalHit = false) {
  if (raffleAudioState.rollIntervalId) {
    window.clearInterval(raffleAudioState.rollIntervalId);
    raffleAudioState.rollIntervalId = null;
  }

  if (playFinalHit) {
    playRaffleWinnerHit();
  }
}

function startRaffleDrumRoll() {
  if (raffleAudioState.rollIntervalId) return;

  const context = ensureRaffleAudioContext();
  if (!context) return;

  playRaffleSnareTick(0.2, 0.09, 850);
  raffleAudioState.rollIntervalId = window.setInterval(() => {
    const dynamicLevel = 0.15 + Math.random() * 0.08;
    const dynamicCutoff = 700 + secureRandomInt(700);
    playRaffleSnareTick(dynamicLevel, 0.08, dynamicCutoff);
  }, 70);
}

function clearRaffleTimers() {
  if (raffleState.spinTimerId) {
    window.clearTimeout(raffleState.spinTimerId);
    raffleState.spinTimerId = null;
  }
  if (raffleState.confettiTimerId) {
    window.clearTimeout(raffleState.confettiTimerId);
    raffleState.confettiTimerId = null;
  }
  stopRaffleDrumRoll(false);
}

function updateRaffleDisplay(name, options = {}) {
  const value = String(name || '').trim();
  raffleState.displayedName = value;

  if (!isRaffleRoute()) return;

  const nameEl = document.getElementById('raffleName');
  const badgeEl = document.getElementById('raffleWinnerBadge');
  if (nameEl) nameEl.textContent = value || 'Waiting for spin...';
  if (badgeEl) badgeEl.textContent = options.winner ? 'Winner Selected' : '';
}

function launchRaffleConfetti() {
  if (!isRaffleRoute()) return;
  const confettiRoot = document.getElementById('raffleConfetti');
  if (!confettiRoot) return;

  const colors = ['#c8ff00', '#ff3d8e', '#3d8eff', '#3dff8e', '#ff8e3d'];
  const pieces = Array.from({ length: 28 }).map(() => {
    const x = `${secureRandomInt(100)}%`;
    const rotate = `${secureRandomInt(360)}deg`;
    const delay = `${secureRandomInt(350)}ms`;
    const color = colors[secureRandomInt(colors.length)];
    return `<span class="raffle-confetti-piece" style="--x:${x};--r:${rotate};--d:${delay};--color:${color}"></span>`;
  });

  confettiRoot.innerHTML = pieces.join('');
  raffleState.confettiTimerId = window.setTimeout(() => {
    if (confettiRoot) confettiRoot.innerHTML = '';
  }, 1800);
}

function finalizeRaffleSpin(winnerName) {
  stopRaffleDrumRoll(true);

  const winner = String(winnerName || '').trim();
  raffleState.spinning = false;
  raffleState.lastWinner = winner;
  raffleState.statusMessage = winner
    ? `${winner} wins this round.`
    : 'Unable to select a winner.';

  if (winner) {
    raffleState.excludedWinners.add(normalizeKey(winner));
    raffleState.winnerHistory.unshift(winner);
    raffleState.winnerHistory = raffleState.winnerHistory.slice(0, RAFFLE_HISTORY_LIMIT);
  }

  renderRaffle();
  launchRaffleConfetti();
}

function startRaffleSpin() {
  if (raffleState.spinning) return;

  const pool = getRafflePool();
  if (!pool.length) {
    raffleState.statusMessage = 'Everyone in this event has already won. Reset the pool to spin again.';
    renderRaffle();
    return;
  }

  clearRaffleTimers();
  raffleState.spinning = true;
  raffleState.statusMessage = `Spinning through ${pool.length} attendees...`;
  startRaffleDrumRoll();

  const winnerName = pool[secureRandomInt(pool.length)];
  const winnerIndex = pool.indexOf(winnerName);
  let cursor = secureRandomInt(pool.length);
  const laps = 18 + secureRandomInt(18);
  const distance = (winnerIndex - cursor + pool.length) % pool.length;
  const totalSteps = laps + distance;
  let step = 0;

  const tick = () => {
    if (!isRaffleRoute()) {
      clearRaffleTimers();
      raffleState.spinning = false;
      return;
    }

    updateRaffleDisplay(pool[cursor], { winner: false });
    if (step >= totalSteps) {
      finalizeRaffleSpin(winnerName);
      return;
    }

    step += 1;
    cursor = (cursor + 1) % pool.length;
    const progress = step / Math.max(totalSteps, 1);
    const delay = 40 + Math.round(progress * progress * 250);
    raffleState.spinTimerId = window.setTimeout(tick, delay);
  };

  tick();
  renderRaffle();
}

function resetRafflePool() {
  clearRaffleTimers();
  raffleState.spinning = false;
  raffleState.excludedWinners.clear();
  raffleState.winnerHistory = [];
  raffleState.lastWinner = '';
  raffleState.displayedName = '';
  raffleState.statusMessage = 'Winner pool reset. Ready for a new round.';
  renderRaffle();
}

function closeRaffle() {
  clearRaffleTimers();
  const url = new URL(window.location);
  url.pathname = '/';
  url.searchParams.delete('name');
  url.searchParams.delete('n');
  window.location.assign(url.toString());
}

      <div class="raffle-card">
        <div class="raffle-metadata">
          <span class="raffle-meta-pill ${sourceClass}">${sourceLabel}</span>
          <span class="raffle-meta-pill">${activeEventLabel}</span>
          <span class="raffle-meta-pill">${remainingCount}/${eligibleCount} remaining</span>
        </div>
        <div class="raffle-display" aria-live="polite">
          <div>
            <div class="raffle-display-label">Current pick</div>
            <div class="raffle-name" id="raffleName">${displayedName || 'Waiting for spin...'}</div>
            <div class="raffle-winner-badge" id="raffleWinnerBadge">${raffleState.lastWinner && !raffleState.spinning ? 'Winner Selected' : ''}</div>
          </div>
          <div class="raffle-confetti" id="raffleConfetti"></div>
        </div>
        <div class="raffle-controls">
          <button class="raffle-btn primary" id="raffleSpinBtn" ${raffleState.spinning || !remainingCount ? 'disabled' : ''}>
            ${spinLabel}
          </button>
          <button class="raffle-btn secondary" id="raffleResetBtn" ${raffleState.spinning ? 'disabled' : ''}>
            Reset Winners
          </button>
        </div>
        <div class="raffle-status">${raffleState.statusMessage || 'Tap spin to select a random winner from this event.'}</div>
        ${raffleState.winnerHistory.length ? `
          <div class="raffle-history">
            <h4>Recent winners</h4>
            <div class="raffle-history-list">
              ${raffleState.winnerHistory.map((name) => `<span class="raffle-history-item">${name}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
    <div class="footer">
      Built with ☕ for the CTRL SHIFT community
    </div>
  `;

  const spinBtn = document.getElementById('raffleSpinBtn');
  const resetBtn = document.getElementById('raffleResetBtn');
  if (spinBtn) spinBtn.addEventListener('click', startRaffleSpin);
  if (resetBtn) resetBtn.addEventListener('click', resetRafflePool);
}

async function initializeDataSource() {
  const fallbackGuests = (selectedEventConfig && selectedEventConfig.guests) || GUESTS;
  setActiveGuests(fallbackGuests);
  activeEventKey = SELECTED_EVENT_KEY;
  activeEventLabel = (selectedEventConfig && selectedEventConfig.label) || formatEventLabel(EVENT_PARAM || EVENT_API_ID_PARAM || EVENT_ID_PARAM);
  liveStatusMessage = `${activeEventLabel} · Attempting live sync`;

  if (selectedEventConfig && selectedEventConfig.mode === 'fallback') {
    activeDataSource = 'fallback';
    liveStatusMessage = `${activeEventLabel} · Archive dataset active`;
    return;
  }

  if (SOURCE_MODE === 'fallback') {
    liveStatusMessage = `${activeEventLabel} · Backup dataset active (forced fallback mode)`;
    return;
  }

  try {
    const url = new URL(LIVE_API_ENDPOINT, window.location.origin);
    if (SOURCE_MODE === 'live') url.searchParams.set('mode', 'live');
    if (EVENT_PARAM) url.searchParams.set('event', EVENT_PARAM);
    if (EVENT_API_ID_PARAM) url.searchParams.set('event_api_id', EVENT_API_ID_PARAM);
    if (EVENT_ID_PARAM) url.searchParams.set('event_id', EVENT_ID_PARAM);

    const response = await fetch(url.toString(), {
      headers: { Accept: 'application/json' },
    });

    if (!response.ok) {
      throw new Error(`live sync HTTP ${response.status}`);
    }

    const payload = await response.json();
    const hasGuests = payload && payload.guests && Object.keys(payload.guests).length > 0;

    if (!hasGuests) {
      throw new Error((payload && payload.error) || 'No live guests returned');
    }

    setActiveGuests(payload.guests);
    activeDataSource = 'live';
    activeEventKey = normalizeKey((payload && payload.event_key) || activeEventKey);
    activeEventApiId = (payload && payload.event_api_id) || activeEventApiId;
    activeEventLabel = formatEventLabel((payload && payload.event_label) || EVENT_PARAM || activeEventApiId || EVENT_ID_PARAM);
    liveStatusMessage = `${activeEventLabel} · Live from Luma · ${guestNames.length} guests synced`;
    setArchiveUnlocked();
  } catch (error) {
    const reason = error && error.message ? error.message : 'Live sync unavailable';
    activeDataSource = 'fallback';
    liveStatusMessage = `${activeEventLabel} · Backup dataset active (${reason})`;
  }
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
}

const gradients = [
  'linear-gradient(135deg, #c8ff00, #3dff8e)',
  'linear-gradient(135deg, #ff3d8e, #ff8e3d)',
  'linear-gradient(135deg, #3d8eff, #8e3dff)',
  'linear-gradient(135deg, #ff3d8e, #8e3dff)',
  'linear-gradient(135deg, #3dff8e, #3d8eff)',
  'linear-gradient(135deg, #c8ff00, #3d8eff)',
  'linear-gradient(135deg, #ff8e3d, #ff3d8e)',
  'linear-gradient(135deg, #8e3dff, #3d8eff)',
];

function hashGradient(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
  return gradients[Math.abs(h) % gradients.length];
}

const ARCHIVE_PASSWORD = 'ctrlshift9';
let archiveUnlocked = true;

function isArchiveUnlocked() {
  return archiveUnlocked;
}

function setArchiveUnlocked() {
  archiveUnlocked = true;
}

function getGuestByKey(key) {
  return guestLookup[normalizeKey(key)] || null;
}

function shouldRenderEventHub() {
  if (isRaffleRoute()) return false;
  const p = new URLSearchParams(window.location.search);
  const directParams = ['event', 'event_key', 'event_api_id', 'eventApiId', 'event_id', 'name', 'n', 'source'];
  return !directParams.some((param) => p.has(param));
}

function renderEventHub() {
  const staticEventCards = Object.keys(EVENT_REGISTRY).map((key) => {
    const eventConfig = EVENT_REGISTRY[key];
    const title = eventConfig.label || formatEventLabel(key);
    const statusLabel = eventConfig.mode === 'fallback' ? '🔒 Archive' : 'Event';
    const description =
      eventConfig.mode === 'fallback'
        ? 'Browse archived matches from previous CTRL SHIFT volumes.'
        : 'Open event matches.';
    const href = `?event=${encodeURIComponent(key)}`;

    return `
      <a class="status-card status-link" href="${href}">
        <div class="status-label">${statusLabel}</div>
        <h3>${title}</h3>
        <p>${description}</p>
      </a>
    `;
  });

  app.innerHTML = `
    <div class="header">
      <div class="header-label">CTRL SHIFT</div>
      <h1>Choose Your <span class="highlight">Event</span></h1>
      <p class="subtitle">Open current matches or browse archives</p>
    </div>
    <div class="archive-shell">
      <div class="archive-grid">
        <a class="status-card status-link vol10" href="?source=auto">
          <div class="status-label">● Live</div>
          <h3>Current Event</h3>
          <p>Go to the active matchmaking page using live Luma sync.</p>
        </a>
        ${staticEventCards.join('')}
      </div>
    </div>
    <div class="footer">
      Built with ☕ for the CTRL SHIFT community
    </div>
  `;
}

function routeVol9() {
  if (isRaffleRoute()) {
    renderRaffle();
    return;
  }

  const p = new URLSearchParams(window.location.search);
  const n = p.get('name') || p.get('n');
  if (n) {
    const g = getGuestByKey(n);
    if (g) renderProfile(g);
    else renderSearch();
    return;
  }
  renderSearch();
}

function renderArchiveGate() {
  app.innerHTML = `
    <div class="header">
      <div class="header-label">CTRL SHIFT</div>
      <h1>Volume 10 <span class="highlight">Coming Soon</span></h1>
      <p class="subtitle">Next edition in progress</p>
    </div>
    <div class="archive-shell">
      <div class="archive-grid">
        <div class="status-card vol10">
          <div class="status-label">● Active Slot</div>
          <h3>CTRL SHIFT Vol. 10</h3>
          <p>New matchmaking and guest updates will appear here when Vol. 10 goes live.</p>
        </div>
        <div class="status-card">
          <div class="status-label">🔒 Archived</div>
          <h3>CTRL SHIFT Vol. 9</h3>
          <p>Vol. 9 is now archived. Enter the password to view the full matchmaking archive.</p>
          <form class="unlock-form" id="unlockForm">
            <input type="password" id="archivePassword" placeholder="Enter archive password" autocomplete="off" />
            <button type="submit" class="unlock-btn">Open Vol. 9 Archive</button>
            <div class="unlock-error" id="unlockError"></div>
          </form>
        </div>
      </div>
    </div>
    <div class="footer">
      Built with ☕ for the CTRL SHIFT community
    </div>
  `;

  const form = document.getElementById('unlockForm');
  const input = document.getElementById('archivePassword');
  const error = document.getElementById('unlockError');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value.trim() === ARCHIVE_PASSWORD) {
      setArchiveUnlocked();
      routeVol9();
      return;
    }
    error.textContent = 'Incorrect password. Try again.';
    input.focus();
    input.select();
  });
}

function renderSearch() {
  app.innerHTML = `
    <div class="header">
      <div class="header-label">${getHeaderLabel()}</div>
      <h1>Find Some <span class="highlight">Friends</span></h1>
      <p class="subtitle">${getHeaderSubtitle()}</p>
    </div>
    <div class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Type your name to find matches..." autocomplete="off" autofocus />
      </div>
      <div id="searchResults"></div>
    </div>
    <div class="footer">
      Built with ☕ for the CTRL SHIFT community
    </div>
  `;
  
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    if (q.length < 1) {
      results.innerHTML = '';
      results.style.display = 'none';
      return;
    }
    
    const matches = guestNames.filter(n => n.toLowerCase().includes(q));
    
    if (matches.length === 0) {
      results.style.display = 'block';
      results.innerHTML = '<div style="padding: 16px 20px; color: var(--text-dim); font-size: 0.8rem;">No guests found with that name</div>';
      return;
    }
    
    results.style.display = 'block';
    results.innerHTML = matches.map(name => {
      const g = guestLookup[normalizeKey(name)];
      const encodedKey = encodeURIComponent(normalizeKey(name));
      return `
        <div class="search-result-item" data-key="${encodedKey}" onclick="selectGuest(decodeURIComponent(this.dataset.key))">
          <div class="avatar" style="background: ${hashGradient(name)}">${getInitials(name)}</div>
          <div class="info">
            <div class="name">${name}</div>
            <div class="role">${g.role || 'Guest'}</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-dim)"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      `;
    }).join('');
  });
}

function selectGuest(key) {
  const g = getGuestByKey(key);
  if (!g) return;
  
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('name', g.name);
  window.history.pushState({}, '', url);
  
  renderProfile(g);
}

window.selectGuest = selectGuest;
window.closeRaffleRoute = closeRaffle;

function renderProfile(guest) {
  const limitedMatches = (guest.matches || []).slice(0, 5);
  const topStrongMatches = limitedMatches.filter(m => m.strength === 'high').slice(0, 2);
  const remainingMatches = limitedMatches.filter(m => !topStrongMatches.includes(m));
  const socialEntries = getSocialEntries(guest.socials);

  const groupedCards = `
    ${topStrongMatches.length ? `<div class="group-label">⚡ Top strong matches</div>` : ''}
    ${topStrongMatches.map((m, i) => renderMatchCard(m, i, 'top-strong')).join('')}
    ${remainingMatches.length ? `<div class="group-label">${topStrongMatches.length ? '✦ More matches' : '✦ Matches'}</div>` : ''}
    ${remainingMatches.map((m, i) => renderMatchCard(m, i + topStrongMatches.length)).join('')}
  `;
  
  app.innerHTML = `
    <div class="header">
      <div class="header-label">${getHeaderLabel()}</div>
    </div>
    <div class="profile-section">
      <button class="back-btn" onclick="goBack()">← Back to search</button>
      <div class="profile-card">
        <div class="profile-avatar" style="background: ${hashGradient(guest.name)}">${getInitials(guest.name)}</div>
        <div class="profile-name">${guest.name}</div>
        <div class="profile-role">${guest.role || 'Guest'}</div>
        ${(guest.interests || []).length ? `
          <div class="profile-tags">
            ${(guest.interests || []).map(i => `<span class="tag accent">${i}</span>`).join('')}
          </div>
        ` : ''}
        ${guest.tools ? `
          <div class="profile-tags" style="margin-top: 8px">
            <span class="tag">🔧 ${guest.tools}</span>
          </div>
        ` : ''}
        ${socialEntries.length ? `
          <div class="social-links">
            ${socialEntries.map((social) => `
              <a
                class="social-link"
                href="${social.url}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="${social.label}"
                title="${social.label}"
              >
                ${social.icon}
              </a>
            `).join('')}
          </div>
        ` : ''}
      </div>
      
      <div class="matches-header">
        Your Matches
        <span class="count">${limitedMatches.length}</span>
      </div>
      
      ${limitedMatches.length > 0 ? groupedCards : `
        <div class="no-matches">
          <div class="emoji">🌿</div>
          <p>No pre-matched connections yet, but that doesn't mean there aren't great people to meet! Explore the event and make your own connections.</p>
        </div>
      `}
    </div>
    <div class="footer">
      Built with ☕ for the CTRL SHIFT community
    </div>
  `;
}

function renderMatchCard(m, i, extraClass = '') {
  const className = extraClass ? `match-card ${extraClass}` : 'match-card';
  const encodedKey = encodeURIComponent(normalizeKey(m.name));
  const socialEntries = getSocialEntries(m.socials);
  return `
    <div class="${className}" data-key="${encodedKey}" style="animation-delay: ${i * 0.08}s" onclick="navigateToMatch(decodeURIComponent(this.dataset.key))">
      <div class="match-card-top">
        <div class="match-avatar" style="background: ${hashGradient(m.name)}">${getInitials(m.name)}</div>
        <div class="match-info">
          <div class="match-name">${m.name}</div>
          <div class="match-role">${m.role}</div>
        </div>
        <div class="match-score ${m.strength}">${m.strength === 'high' ? '⚡ Strong' : '✦ Good'}</div>
      </div>
      <div class="match-reason">${m.reason}</div>
      ${socialEntries.length ? `
        <div class="social-links match-social-links">
          ${socialEntries.map((social) => `
            <a
              class="social-link"
              href="${social.url}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="${social.label}"
              title="${social.label}"
              onclick="event.stopPropagation()"
            >
              ${social.icon}
            </a>
          `).join('')}
        </div>
      ` : ''}
      <div class="match-shared">
        ${(m.shared || []).map(s => `<span class="shared-tag">${s}</span>`).join('')}
      </div>
    </div>
  `;
}

window.navigateToMatch = function(key) {
  const g = getGuestByKey(key);
  if (g) {
    const url = new URL(window.location);
    url.searchParams.set('name', g.name);
    window.history.pushState({}, '', url);
    renderProfile(g);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

window.goBack = function() {
  const url = new URL(window.location);
  url.searchParams.delete('name');
  url.searchParams.delete('n');
  window.history.pushState({}, '', url);
  if (shouldRenderEventHub()) {
    renderEventHub();
    return;
  }
  renderSearch();
};

// Handle browser back/forward
window.addEventListener('popstate', () => {
  if (shouldRenderEventHub()) {
    renderEventHub();
    return;
  }
  routeVol9();
});

// Init
if (shouldRenderEventHub()) {
  renderEventHub();
} else {
  initializeDataSource().then(() => {
    routeVol9();
  });
}
</script>
